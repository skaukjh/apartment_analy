# 매시간 브리핑 tick 호출
#
# Vercel Hobby 요금제는 cron 을 하루 1회만 허용한다.
# 하루 4회(04·10·17·21시 KST) 발송과 1시간 간격 데이터 갱신이 필요하므로
# 스케줄만 GitHub Actions 로 옮기고, 실제 일은 배포된 앱이 한다.
#
# 준비: 레포 Settings → Secrets and variables → Actions 에 두 개 등록
#   CRON_SECRET  — .env.local 의 값과 동일
#   APP_URL      — https://apartment-analy.vercel.app
name: 브리핑 tick

on:
  schedule:
    # GitHub Actions 는 UTC 기준. KST = UTC + 9.
    # 무료 러너의 cron 은 30~50분씩 밀리고 가끔 한 시간을 통째로 거른다.
    # 30분 간격 두 번으로 촘촘히 하고, 서버(tick)가 중복 발송을 막는다.
    - cron: '0,30 * * * *'
  # 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      slot:
        description: '강제 발송할 슬롯 (morning/noon/evening/night). 비우면 현재 시각 기준'
        required: false
        default: ''

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: tick 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL 또는 CRON_SECRET 시크릿이 없습니다."
            exit 1
          fi

          URL="$APP_URL/api/cron/tick?secret=$CRON_SECRET"
          if [ -n "$SLOT" ]; then
            URL="$URL&slot=$SLOT"
          fi

          # 시크릿이 로그에 남지 않도록 URL 은 출력하지 않는다
          CURL_EXIT=0
          CODE=$(curl -s -o response.json -w '%{http_code}' --max-time 290 "$URL") || CURL_EXIT=$?

          # 응답을 못 받아도 서버 작업은 계속되고, 못 보낸 슬롯은 다음 tick 이 따라잡는다.
          # (실거래 갱신이 겹치는 시간대엔 290초를 넘길 수 있다) — 실패로 처리하지 않는다.
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::tick 응답 대기가 끊겼습니다 (curl exit $CURL_EXIT). 서버 처리는 계속되며 다음 tick 이 미발송분을 따라잡습니다."
            exit 0
          fi

          echo "HTTP $CODE"
          cat response.json
          # 5xx 만 실패로 본다 (발송 시각이 아니면 200 + sent:false 가 정상)
          [ "$CODE" -lt 500 ]
